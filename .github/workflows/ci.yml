name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Offline CrystalTwinAI bridge smoke
        run: |
          python scripts/crystaltwin_bridge.py tests/fixtures/crystaltwin_snapshot.synthetic.json "$RUNNER_TEMP/qfabric-bridge-report.json" --backend cpu --shots 256
          python scripts/crystaltwin_bridge.py tests/fixtures/crystaltwin_snapshot.synthetic.json "$RUNNER_TEMP/qfabric-bridge-report.json" --verify
      - name: Research proposal orchestration smoke (offline)
        run: |
          python scripts/research_agent_gate.py prepare tests/fixtures/crystaltwin_snapshot.synthetic.json "$RUNNER_TEMP/agent-proposal.json" --parameter coolingRate --value 0.25
          python scripts/research_agent_gate.py assess tests/fixtures/crystaltwin_snapshot.synthetic.json "$RUNNER_TEMP/agent-proposal.json" "$RUNNER_TEMP/agent-assessment.json"
          python scripts/research_agent_gate.py review tests/fixtures/crystaltwin_snapshot.synthetic.json "$RUNNER_TEMP/agent-proposal.json" "$RUNNER_TEMP/agent-assessment.json" "$RUNNER_TEMP/agent-review.json" --reviewer-label "CI-synthetic-test" --decision approve --attest-educational-only
      - name: Quantum dataset candidates and synthetic count baseline (offline)
        run: |
          python scripts/quantum_dataset_baseline.py validate-catalog data/quantum_dataset_candidates.json
          python scripts/quantum_dataset_baseline.py validate-ai-catalog data/quantum_ai_eval_candidates.json
          python scripts/quantum_dataset_baseline.py validate-intake data/quantum_source_intake.json --catalog data/quantum_dataset_candidates.json
          python scripts/quantum_dataset_baseline.py validate-alternative-sources data/independent_baseline_sources.json
          python scripts/quantum_dataset_baseline.py synthetic-falsification tests/fixtures/falsification.synthetic.json --sources data/independent_baseline_sources.json --output "$RUNNER_TEMP/falsification-synthetic-report.json"
          python scripts/verify_registry_csv_snapshot.py
          python scripts/gari_reference_check.py
          python scripts/quantum_dataset_baseline.py synthetic-baseline tests/fixtures/quantum_counts.synthetic.json --output "$RUNNER_TEMP/quantum-synthetic-baseline.json"
